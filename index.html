    <!-- Allow the C++ to access the canvas element and some C++ methods --> 
    <script type='text/javascript'>
        var get_info;
        var ecount;
        var Module = {
            onRuntimeInitialized: function(){
                get_info = Module.cwrap('get_info', 'string', ['number']);
                ecount = Module.cwrap('ecount', 'number', ['']);
            },
            canvas: (function() { return document.getElementById('canvas'); })()
        };

        //https://stackoverflow.com/a/7616484
        Object.defineProperty(String.prototype, 'hashCode', {
            value: function() {
                var hash = 0, i, chr;
                for (i = 0; i < this.length; i++) {
                chr   = this.charCodeAt(i);
                hash  = ((hash << 5) - hash) + chr;
                hash |= 0; // Convert to 32bit integer
                }
                return hash;
            }
        });
    </script>
    
    <!-- Add the javascript glue code (index.js) as generated by Emscripten -->
    <script>
        
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        function getIcon(){

        }

        $(document).ready(function(){
            if(window.location.search) setSeed(window.location.search);
            ctx.canvas.width = 1000;

            setInterval(()=>{

        var seed = 0;
        function getSeed(){

        }

            seed = String(_seed).hashCode();
